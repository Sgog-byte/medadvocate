<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MedAdvocate — Medical Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{--sage:#2d6a4f;--sage-deep:#1b4332;--sage-light:#95d5b2;--sage-pale:#e8f5ee;--warm:#fdfcf8;--ink:#0d1f15;--ink-soft:#1b4332;--ink-muted:#2d6a4f;--border:#b7d9c4;--white:#ffffff;--amber:#c9923a;--amber-pale:#fdf3e7;--amber-light:#f0d4a8;--red:#c0392b;--red-pale:#fff5f5;--red-border:#fccaca;--blue:#3a7bc8;--blue-pale:#eef4fc;--shadow-sm:0 2px 12px rgba(28,43,34,.06);--shadow:0 4px 24px rgba(28,43,34,.10);--shadow-lg:0 12px 48px rgba(28,43,34,.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--warm);color:var(--ink);min-height:100vh}
nav{position:sticky;top:0;z-index:100;background:#fdfcf8;border-bottom:2px solid var(--sage-deep);padding:0 28px;display:flex;align-items:center;height:60px;gap:10px}
.nav-back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-muted);padding:7px 14px;border:1.5px solid var(--border);border-radius:100px;cursor:pointer;background:none;font-family:'DM Sans',sans-serif;transition:all .2s}
.nav-back:hover{border-color:var(--sage);color:var(--sage-deep)}
.nav-logo{display:flex;align-items:center;gap:9px;margin-right:auto}
.nav-gem{width:30px;height:30px;background:var(--sage-deep);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px}
.nav-wordmark{font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:var(--ink)}
.nav-wordmark .dot{display:inline-block;width:7px;height:7px;background:var(--sage-light);border-radius:50%;margin:0 3px 3px 2px;vertical-align:middle}
.nav-wordmark .adv{color:var(--sage);font-weight:300}
.shell{max-width:860px;margin:0 auto;padding:0 22px 80px}
.page-header{padding:28px 0 20px;text-align:center}
.page-icon{font-size:40px;margin-bottom:10px}
.page-title{font-family:'Fraunces',serif;font-size:30px;font-weight:300;color:var(--ink);margin-bottom:7px}
.page-title em{font-style:italic;color:var(--sage)}
.page-sub{font-size:14px;color:var(--ink-muted);font-weight:300;max-width:500px;margin:0 auto}
.fcard{background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.finput,.ftextarea{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;color:var(--ink);background:var(--warm);outline:none;transition:border-color .2s;resize:none}
.finput:focus,.ftextarea:focus{border-color:var(--sage);background:var(--white)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.flabel{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:5px}
.btn-primary{padding:12px 24px;background:var(--sage-deep);color:white;border:none;border-radius:11px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-primary:hover{background:var(--ink)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{padding:10px 18px;background:transparent;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink-soft);cursor:pointer;transition:all .2s}
.btn-outline:hover{border-color:var(--sage);color:var(--sage-deep)}
.sources-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:18px}
.source-chip{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;cursor:pointer;background:var(--white);transition:all .2s;user-select:none}
.source-chip.has-data{border-color:var(--sage-light);background:var(--sage-pale)}
.source-chip.has-data.selected{border-color:var(--sage-deep);box-shadow:0 0 0 2px var(--sage-deep)}
.source-chip.no-data{opacity:.4;cursor:not-allowed}
.source-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#ccc}
.source-dot.green{background:var(--sage)}
.summary-doc{background:var(--white);border:2px solid var(--sage-deep);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg)}
.sum-header{background:var(--sage-deep);padding:24px 28px;color:white}
.sum-patient{font-family:'Fraunces',serif;font-size:24px;font-weight:300;margin-bottom:4px}
.sum-meta{font-size:12px;color:rgba(255,255,255,.6)}
.sum-body{padding:24px 28px}
.sum-sec{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.sum-sec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.sum-sec-title{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--sage-deep);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.sum-remove-btn{font-size:10px;font-weight:500;color:#aaa;background:none;border:1px solid #e0e0e8;border-radius:5px;padding:2px 8px;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0;transition:all .15s}
.sum-remove-btn:hover{color:var(--red);border-color:var(--red);background:var(--red-pale)}
.sum-item{padding:9px 13px;background:var(--sage-pale);border-radius:9px;margin-bottom:7px;font-size:14px;color:var(--ink-soft);line-height:1.6;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sum-item.red{background:var(--red-pale);border-left:3px solid var(--red)}
.sum-item.amber{background:var(--amber-pale);border-left:3px solid var(--amber)}
.sum-item-text{flex:1}
.sum-item-remove{flex-shrink:0;background:none;border:none;color:#ccc;font-size:14px;cursor:pointer;padding:0 2px;line-height:1;transition:color .15s;align-self:center}
.sum-item-remove:hover{color:var(--red)}
.sum-footer{background:var(--warm);border-top:1px solid var(--border);padding:12px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--ink-muted)}
.load-wrap{text-align:center;padding:48px 24px}
.load-ring{width:48px;height:48px;margin:0 auto 18px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--sage);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.abtn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:none}
.abtn-dark{background:var(--ink);color:white}
.abtn-outline{background:transparent;border:1.5px solid var(--border);color:var(--ink-soft)}
.abtn-outline:hover{border-color:var(--sage);color:var(--sage-deep)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--ink);color:white;padding:10px 22px;border-radius:100px;font-size:13px;font-weight:500;transition:transform .3s;z-index:9999}
.toast.show{transform:translateX(-50%) translateY(0)}
@media print{
  /* ── Page setup ── */
  @page{size:letter;margin:18mm 20mm}

  /* ── Hide all UI chrome ── */
  nav,
  .page-header,
  .fcard,
  .action-row,
  #howToUseBtn,
  .toast,
  #tourCard,
  .sum-remove-btn,
  .sum-item-remove,
  .load-wrap{display:none!important}

  /* ── Reset body & shell ── */
  html,body{background:#fff!important;color:#000!important;font-size:11pt;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .shell{max-width:100%!important;padding:0!important;margin:0!important}

  /* ── Outer document card — simple bordered box ── */
  .summary-doc{border:none!important;border-radius:0!important;box-shadow:none!important}

  /* ── Green header bar ── */
  .sum-header{
    background:#1b4332!important;
    color:#fff!important;
    padding:14pt 18pt!important;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
    border-bottom:2pt solid #1b4332!important
  }
  .sum-patient{font-size:20pt!important;font-weight:400!important;margin-bottom:3pt!important}
  .sum-meta{font-size:9pt!important;color:rgba(255,255,255,.8)!important}

  /* ── Body padding ── */
  .sum-body{padding:14pt 18pt!important}

  /* ── Sections — keep together, rule between them ── */
  .sum-sec{
    page-break-inside:avoid;
    break-inside:avoid;
    margin-bottom:12pt!important;
    padding-bottom:12pt!important;
    border-bottom:0.5pt solid #ccc!important
  }
  .sum-sec:last-child{border-bottom:none!important;margin-bottom:0!important;padding-bottom:0!important}

  /* ── Section title labels ── */
  .sum-sec-title{
    font-size:7.5pt!important;
    letter-spacing:.15em!important;
    color:#1b4332!important;
    font-weight:700!important;
    margin-bottom:7pt!important;
    padding-bottom:3pt!important;
    border-bottom:1pt solid #2d6a4f!important;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important
  }

  /* ── Strip coloured boxes from items — use plain lines ── */
  .sum-item{
    background:none!important;
    border-radius:0!important;
    border:none!important;
    border-left:none!important;
    padding:3pt 0 3pt 12pt!important;
    margin-bottom:4pt!important;
    font-size:10.5pt!important;
    line-height:1.5!important;
    color:#000!important;
    position:relative
  }
  /* Bullet dot for all items */
  .sum-item::before{content:'•';position:absolute;left:0;top:3pt;color:#2d6a4f;font-size:10pt;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  /* Red items — small accent */
  .sum-item.red{color:#000!important}
  .sum-item.red::before{content:'!';color:#c0392b!important;font-weight:700}
  /* Amber items */
  .sum-item.amber::before{content:'→';color:#c9923a!important}

  /* ── Clinical snapshot quote block ── */
  .sum-body > .sum-sec:first-child [style*="border-left"]{
    background:none!important;
    border-left:2pt solid #2d6a4f!important;
    padding:6pt 12pt!important;
    font-size:11pt!important;
    color:#000!important;
    font-style:italic;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important
  }

  /* ── Footer ── */
  .sum-footer{
    background:none!important;
    border-top:0.5pt solid #999!important;
    padding:6pt 18pt!important;
    font-size:8pt!important;
    color:#555!important
  }
}
@media(max-width:640px){.two-col{grid-template-columns:1fr}.sum-body,.sum-header{padding:16px}}
.hidden{display:none!important}
/* ── GUIDED TOUR ── */
.tour-ring{outline:3px solid #22c55e!important;outline-offset:6px!important;box-shadow:0 0 0 10px rgba(34,197,94,.10)!important;border-radius:14px;position:relative;z-index:10;transition:outline .25s,box-shadow .25s}
#tourCard{position:fixed;width:340px;max-width:calc(100vw - 28px);background:#fff;border:1.5px solid #22c55e;border-radius:18px;padding:20px 22px 18px;box-shadow:0 10px 40px rgba(0,0,0,.14);z-index:9999;transition:opacity .2s ease}
.tour-step-num{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#22c55e;margin-bottom:6px}
.tour-card-title{font-family:'Fraunces',serif;font-size:17px;font-weight:400;color:var(--ink);margin-bottom:8px;line-height:1.3}
.tour-card-body{font-size:13px;color:var(--ink-soft);line-height:1.65;margin-bottom:16px}
.tour-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tour-skip-btn{font-size:12px;color:var(--ink-muted);background:transparent;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.tour-skip-btn:hover{color:var(--ink)}
.tour-next-btn{padding:9px 20px;background:#22c55e;color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.tour-next-btn:hover{background:#16a34a}
#howToUseBtn{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:7px 18px;background:transparent;border:1.5px solid var(--border);border-radius:100px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:all .2s}
#howToUseBtn:hover{border-color:#22c55e;color:#16a34a;background:rgba(34,197,94,.06)}
</style>
  <!-- Supabase auth + data layer -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>

</head>
<body>
<nav>
  <button class="nav-back" onclick="window.location.href='index.html'">← Home</button>
  <div class="nav-logo"><div class="nav-gem">🌿</div><div class="nav-wordmark">Med<span class="dot"></span><span class="adv">Advocate</span></div></div>
</nav>
<div class="shell">
  <div class="page-header">
    <div class="page-icon">📋</div>
    <h1 class="page-title">Medical <em>Summary</em></h1>
    <p class="page-sub">A complete clinical snapshot pulled automatically from all your MedAdvocate tools. Hand it to any new doctor in 60 seconds.</p>
    <button id="howToUseBtn" onclick="tourStart()">▶ How to use</button>
  </div>

  <div class="fcard">
    <div style="font-family:'Fraunces',serif;font-size:17px;color:var(--ink);margin-bottom:4px">Choose What to Include</div>
    <div style="font-size:13px;color:var(--ink-muted);margin-bottom:14px;font-weight:300">🟢 Green = data found in your tools · Grey = no data yet · Click to toggle sections</div>
    <div class="sources-grid" id="sources_grid"></div>
    <div style="margin-bottom:12px">
      <label class="flabel">Appointment / Purpose</label>
      <input type="text" class="finput" id="sum_purpose" placeholder="e.g. New patient — Pediatric Cardiology, Dr. Webb · CHOA">
    </div>
    <div class="two-col" style="margin-bottom:14px">
      <div>
        <label class="flabel">Additional context</label>
        <textarea class="ftextarea" id="sum_notes" placeholder="Anything else the doctor should know…" style="min-height:70px"></textarea>
      </div>
      <div>
        <label class="flabel">Goals for this visit</label>
        <textarea class="ftextarea" id="sum_goals" placeholder="e.g. Diagnosis, referral, new treatment options…" style="min-height:70px"></textarea>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn-primary" onclick="generateSummary()" id="gen_btn">📋 Generate Medical Summary</button>
      <button class="btn-outline" onclick="window.print()">🖨️ Print</button>
    </div>
  </div>
  <div id="sum_out"></div>
</div>
<div class="toast" id="toast"></div>

<!-- Tour card -->
<div id="tourCard" class="hidden">
  <div class="tour-step-num"></div>
  <div class="tour-card-title"></div>
  <div class="tour-card-body"></div>
  <div class="tour-actions">
    <button class="tour-skip-btn" onclick="tourSkip()">Skip tour</button>
    <button class="tour-next-btn" onclick="tourNext()">Next →</button>
  </div>
</div>

<script>
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function fmtD(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch{return d}}

const SOURCES=[
  {key:'profile',icon:'👤',label:'Patient Profile',check:async()=>{const p=await DB.getProfile();return Object.keys(p).filter(k=>p[k]).length>0;}},
  {key:'diagnoses',icon:'🔴',label:'Diagnoses',check:async()=>{const p=await DB.getProfile();return p.diagnoses?.length>0;}},
  {key:'medications',icon:'💊',label:'Medications',check:async()=>{
    try{if(JSON.parse(localStorage.getItem('advocate_medications')||'[]').length>0)return true;}catch{}
    try{return (await DB.getMedications()).length>0;}catch{return false;}
  }},
  {key:'symptoms',icon:'📊',label:'Symptoms',check:async()=>(await DB.getSymptomEntries()).length>0},
  {key:'labs',icon:'🧪',label:'Lab Results',check:async()=>{
    // Check localStorage first (labs tracker always writes here)
    try{if(JSON.parse(localStorage.getItem('advocate_lab_results')||'[]').length>0)return true;}catch{}
    // Then try Supabase
    try{const db=await DB.getLabReports();if(db.length)return true;}catch{}
    return false;
  }},
  {key:'tests',icon:'🔬',label:'Tests & Imaging',check:async()=>(await DB.getDiagnosticTests()).length>0},
  {key:'timeline',icon:'📅',label:'Medical History',check:async()=>(await DB.getTimelineEvents()).length>0},
  {key:'flares',icon:'🔥',label:'Flare History',check:async()=>(await DB.getFlares()).length>0},
  {key:'careteam',icon:'👥',label:'Care Team',check:async()=>(await DB.getCareTeam()).length>0},
  {key:'documents',icon:'📄',label:'Documents',check:async()=>(await DB.getDocuments()).length>0},
];

let sel=new Set();

async function renderSources(){
  const grid=document.getElementById('sources_grid');
  const results=await Promise.all(SOURCES.map(s=>s.check().catch(()=>false)));
  grid.innerHTML=SOURCES.map((s,i)=>{
    const has=!!results[i];
    if(has)sel.add(s.key);
    return`<div class="source-chip ${has?'has-data selected':'no-data'}" id="chip-${s.key}" onclick="${has?`toggleSrc('${s.key}')`:''}" style="gap:8px">
      <div class="source-dot ${has?'green':''}"></div>
      <span style="flex:1">${s.icon} ${s.label}</span>
      <span style="font-size:10px;color:${has?'var(--sage)':'#ccc'}">${has?'✓':'—'}</span>
    </div>`;
  }).join('');
}

function toggleSrc(key){
  const chip=document.getElementById('chip-'+key);
  if(sel.has(key)){sel.delete(key);chip.classList.remove('selected');}
  else{sel.add(key);chip.classList.add('selected');}
}

async function buildData(){
  const p=(await DB.getProfile());
  // Medications: localStorage first (always up to date), fall back to Supabase
  let meds=[];
  try{meds=JSON.parse(localStorage.getItem('advocate_medications')||'[]');}catch{}
  if(!meds.length){try{meds=await DB.getMedications();}catch{}}
  // Labs: localStorage first (labs tracker always writes here), then Supabase
  let labReports=[];
  try{labReports=JSON.parse(localStorage.getItem('advocate_lab_results')||'[]');}catch{}
  if(!labReports.length){try{labReports=await DB.getLabReports();}catch{}}
  const timeline=(await DB.getTimelineEvents());
  const flares=(await DB.getFlares());
  const symState=JSON.parse(localStorage.getItem('advocate_symptoms')||'{"trackedSymptoms":[]}');
  const symEntries=(await DB.getSymptomEntries());
  const labs=(await DB.getLabResults());
  const tests=(await DB.getDiagnosticTests());
  const contacts=(await DB.getCareTeam());
  const docs=(await DB.getDocuments());
  const parts=[];

  if(sel.has('profile')&&p.name) parts.push(`PATIENT: ${p.name}${p.age?', age '+p.age:''}`);
  if(sel.has('diagnoses')&&p.diagnoses) parts.push(`DIAGNOSES: ${p.diagnoses}`);
  if(sel.has('medications')&&meds.length){
    const active=meds.filter(m=>m.status==='active');
    const stopped=meds.filter(m=>m.status!=='active');
    // support both localStorage (freq, reason) and Supabase (frequency) field names
    if(active.length) parts.push(`CURRENT MEDICATIONS:\n${active.map(m=>`- ${m.name}${m.dose?' '+m.dose:''}${(m.freq||m.frequency)?' '+(m.freq||m.frequency):''}${m.reason?' — '+m.reason:''}`).join('\n')}`);
    if(stopped.length) parts.push(`STOPPED/PAUSED: ${stopped.map(m=>m.name).join(', ')}`);
  }
  if(sel.has('symptoms')&&symEntries.length){
    const latest=symEntries[symEntries.length-1];
    const tracked=symState.trackedSymptoms||[];
    const DOD={3:'Sometimes distracts',4:'Distracts, can function',5:'Interrupts activities',6:'Hard to ignore',7:'Prevents daily activities',8:'Awful',9:"Can't bear it",10:'Worst possible'};
    const active=tracked.filter(s=>latest.symptoms?.[s.id]>=3).sort((a,b)=>(latest.symptoms[b.id]||0)-(latest.symptoms[a.id]||0));
    if(active.length) parts.push(`CURRENT SYMPTOMS (${fmtD(latest.date)}):\n${active.map(s=>`- ${s.label}: ${latest.symptoms[s.id]}/10 — ${DOD[latest.symptoms[s.id]]||'Severe'}`).join('\n')}`);
  }
  if(sel.has('labs')&&labReports.length){
    // Each report: {date, fileName, results:[{name, value, unit, status, note, low, high}]}
    const latest=labReports[labReports.length-1];
    const allAbnormal=labReports.flatMap(r=>(r.results||[]).filter(t=>t.status!=='normal'));
    const latestLines=(latest.results||[]).slice(0,20).map(r=>`- ${r.name}${r.value?' '+r.value:''}${r.unit?' '+r.unit:''}${r.low&&r.high?' ('+r.low+'–'+r.high+')':''}${r.status&&r.status!=='normal'?' ['+r.status+']':''}${r.note?' — '+r.note:''}`);
    parts.push(`LAB RESULTS — Latest panel (${fmtD(latest.date)}, ${labReports.length} report${labReports.length>1?'s':''} total):\n${latestLines.join('\n')}${allAbnormal.length?'\n⚠️ Abnormal across all dates: '+allAbnormal.map(r=>r.name).join(', '):''}`);
  }
  if(sel.has('tests')&&tests.length){
    const abnormal=tests.filter(t=>t.status==='abnormal');
    parts.push(`TESTS & IMAGING (${tests.length} total):\n${tests.slice(0,6).map(t=>`- ${t.type} (${fmtD(t.date)}): ${t.status}${t.results?' — '+t.results.substring(0,80):''}`).join('\n')}${abnormal.length?'\nABNORMAL: '+abnormal.map(t=>t.type).join(', '):''}`);
  }
  if(sel.has('timeline')&&timeline.length){
    const sorted=[...timeline].sort((a,b)=>new Date(a.date)-new Date(b.date));
    ['diagnosis','hospitalization','procedure'].forEach(cat=>{
      const evts=sorted.filter(e=>e.cat===cat);
      if(evts.length) parts.push(`${cat.toUpperCase()}S:\n${evts.map(e=>`- ${fmtD(e.date)}: ${e.title}${e.doctor?' ('+e.doctor+')':''}`).join('\n')}`);
    });
  }
  if(sel.has('flares')&&flares.length){
    const recent=flares.slice(0,10);
    const avg=(recent.reduce((a,f)=>a+f.severity,0)/recent.length).toFixed(1);
    const triggers=Object.entries(recent.reduce((acc,f)=>{(f.triggers||[]).forEach(t=>acc[t]=(acc[t]||0)+1);return acc},{})).sort((a,b)=>b[1]-a[1]);
    parts.push(`FLARE HISTORY: ${flares.length} flares. Avg severity: ${avg}/10. Top triggers: ${triggers.slice(0,3).map(t=>t[0]).join(', ')||'unspecified'}`);
  }
  if(sel.has('careteam')&&contacts.length){
    parts.push(`CARE TEAM:\n${contacts.map(c=>`- ${c.name}${c.specialty?', '+c.specialty:''}${c.practice?' at '+c.practice:''}${c.phone?' · '+c.phone:''}`).join('\n')}`);
  }
  if(sel.has('documents')&&docs.length){
    parts.push(`DOCUMENTS ON FILE: ${docs.map(d=>d.name||d.type||'Document').join(', ')}`);
  }
  return parts.join('\n\n');
}

async function generateSummary(){
  if(sel.size===0){showToast('Please select at least one data source');return;}
  const dataStr=await buildData();
  if(!dataStr.trim()){showToast('No data found in selected sections — add data to your tools first');return;}
  const purpose=document.getElementById('sum_purpose').value.trim();
  const notes=document.getElementById('sum_notes').value.trim();
  const goals=document.getElementById('sum_goals').value.trim();
  const profile=(await DB.getProfile());
  const out=document.getElementById('sum_out');
  document.getElementById('gen_btn').disabled=true;
  out.innerHTML=`<div class="load-wrap"><div class="load-ring"></div><p style="font-family:'Fraunces',serif;font-size:18px;font-weight:300;color:var(--ink);margin-bottom:6px">Building your medical summary…</p><p style="font-size:13px;color:var(--ink-muted)">Synthesizing data from ${sel.size} sources</p></div>`;

  try{
    const r=await fetch('/.netlify/functions/claude-proxy',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1400,
        system:`Create a clinical summary. Return ONLY this JSON (no markdown, no extra text):
{"snapshot":"2 sentence clinical overview","concerns":["up to 4 concerns"],"meds":[{"name":"","dose":"","for":""}],"findings":["up to 3 notable findings"],"history":["up to 3 key events"],"questions":["3 questions"]}
Rules: Include ALL medications — do not skip any. The "questions" must be specific to the appointment specialty and doctor type stated by the user — not generic. If no specialty is given, base questions on the most pressing concerns in the data.`,
        messages:[{role:'user',content:`${purpose?`THIS APPOINTMENT IS WITH: ${purpose}\nGenerate questions specifically relevant to this specialist and what they can help with.\n\n`:''}Patient data:\n\n${dataStr.slice(0,4000)}${goals?'\nPatient goals: '+goals:''}`}]})
    });
    const responseText=await r.text();
    if(!r.ok||responseText.trimStart().startsWith('<')) throw new Error('Server error (HTTP '+r.status+'). This is usually a function timeout — the AI took too long. Please try again.');
    let d;
    try{d=JSON.parse(responseText);}catch(e){throw new Error('Invalid response from server. Please try again.');}
    if(d.error) throw new Error('API error: '+(d.error.message||JSON.stringify(d.error)));
    const rawText=(d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    if(!rawText) throw new Error('Empty AI response — check that your Anthropic API key is set in Netlify environment variables.');
    let res;
    try{res=JSON.parse(rawText);}catch(e){throw new Error('AI response was incomplete. Try again — it sometimes needs a second attempt.');}
    const today=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    const name=profile.name||'Patient';

    out.innerHTML=`
      <div class="action-row" style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px">
        <button class="abtn abtn-dark" onclick="window.print()">🖨️ Print</button>
        <button class="abtn abtn-outline" onclick="emailSum()">✉️ Email</button>
        <button class="abtn abtn-outline" onclick="copySum()">📋 Copy</button>
        <button class="abtn abtn-outline" onclick="document.getElementById('sum_out').innerHTML=''">✕ Clear</button>
      </div>
      <div class="summary-doc">
        <div class="sum-header">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">
            <div>
              <div class="sum-patient">${escH(name)}${profile.age?', age '+profile.age:''}</div>
              <div class="sum-meta">${purpose?escH(purpose)+' · ':''}${today} · MedAdvocate</div>
            </div>
            <div style="font-family:'Fraunces',serif;font-size:32px;color:rgba(255,255,255,.3)">📋</div>
          </div>
        </div>
        <div class="sum-body">
          ${res.snapshot?`<div class="sum-sec"><div class="sum-sec-title"><span>🩺 Clinical Snapshot</span><button class="sum-remove-btn" onclick="this.closest('.sum-sec').remove()">✕ Section</button></div><div style="font-family:'Fraunces',serif;font-style:italic;font-size:16px;color:var(--ink-soft);line-height:1.7;padding:14px 18px;background:var(--sage-pale);border-left:3px solid var(--sage);border-radius:0 12px 12px 0">${escH(res.snapshot)}</div></div>`:''}
          ${res.concerns?.length?`<div class="sum-sec"><div class="sum-sec-title"><span>🔴 Primary Concerns</span><button class="sum-remove-btn" onclick="this.closest('.sum-sec').remove()">✕ Section</button></div>${res.concerns.map(c=>`<div class="sum-item"><span class="sum-item-text">${escH(c)}</span><button class="sum-item-remove" onclick="this.closest('.sum-item').remove()" title="Remove">✕</button></div>`).join('')}</div>`:''}
          ${res.meds?.length?`<div class="sum-sec"><div class="sum-sec-title"><span>💊 Current Medications</span><button class="sum-remove-btn" onclick="this.closest('.sum-sec').remove()">✕ Section</button></div>${res.meds.map(m=>`<div class="sum-item"><span class="sum-item-text"><strong>${escH(m.name)}</strong>${m.dose?' — '+escH(m.dose):''}${m.for?' · '+escH(m.for):''}</span><button class="sum-item-remove" onclick="this.closest('.sum-item').remove()" title="Remove">✕</button></div>`).join('')}</div>`:''}
          ${res.findings?.length?`<div class="sum-sec"><div class="sum-sec-title"><span>🧪 Recent Findings</span><button class="sum-remove-btn" onclick="this.closest('.sum-sec').remove()">✕ Section</button></div>${res.findings.map(f=>`<div class="sum-item amber"><span class="sum-item-text">→ ${escH(f)}</span><button class="sum-item-remove" onclick="this.closest('.sum-item').remove()" title="Remove">✕</button></div>`).join('')}</div>`:''}
          ${res.history?.length?`<div class="sum-sec"><div class="sum-sec-title"><span>📅 Medical History</span><button class="sum-remove-btn" onclick="this.closest('.sum-sec').remove()">✕ Section</button></div>${res.history.map(h=>`<div class="sum-item"><span class="sum-item-text">${escH(h)}</span><button class="sum-item-remove" onclick="this.closest('.sum-item').remove()" title="Remove">✕</button></div>`).join('')}</div>`:''}
          ${res.questions?.length?`<div class="sum-sec"><div class="sum-sec-title"><span>❓ Questions for the Doctor</span><button class="sum-remove-btn" onclick="this.closest('.sum-sec').remove()">✕ Section</button></div>${res.questions.map(q=>`<div class="sum-item"><span class="sum-item-text">? ${escH(q)}</span><button class="sum-item-remove" onclick="this.closest('.sum-item').remove()" title="Remove">✕</button></div>`).join('')}</div>`:''}
        </div>
        <div class="sum-footer">
          <span>Generated from patient-entered data. Verify all information with your healthcare provider.</span>
          <span style="font-family:'Fraunces',serif">MedAdvocate · medadvocate.org</span>
        </div>
      </div>`;

    window._sumText=`MEDICAL SUMMARY — ${name}\n${today}${purpose?'\n'+purpose:''}\n\n${res.clinicalSnapshot||''}\n\nPRIMARY CONCERNS:\n${(res.primaryConcerns||[]).map(c=>'• '+c).join('\n')}\n\nMEDICATIONS:\n${(res.currentMedications||[]).map(m=>'• '+m.name+' '+m.dose).join('\n')}\n\nQUESTIONS FOR DOCTOR:\n${(res.questionsForDoctor||[]).map(q=>'? '+q).join('\n')}`;
  }catch(e){
    out.innerHTML=`<div style="background:var(--red-pale);border:1px solid var(--red-border);border-radius:12px;padding:16px;color:var(--red)"><strong>Something went wrong.</strong><br><span style="font-size:12px;opacity:.8">${escH(e.message||String(e))}</span></div>`;
    console.error(e);
  }finally{document.getElementById('gen_btn').disabled=false;}
}

async function emailSum(){
  const p=(await DB.getProfile());
  window.location.href=`mailto:?subject=${encodeURIComponent('Medical Summary — '+(p.name||'Patient'))}&body=${encodeURIComponent(window._sumText||'')}`;
}
function copySum(){navigator.clipboard.writeText(window._sumText||'').then(()=>showToast('Copied ✓'));}

renderSources();
</script>

<script>
(function () {
  const TOUR_KEY = 'medadvocate_summary_tour_v1';

  const STEPS = [
    {
      target: '.page-header',
      title: 'Welcome to Medical Summary',
      body: 'This tool builds a professional one-page clinical summary from all your MedAdvocate data — ready to hand to any new doctor in 60 seconds.',
      voice: 'Welcome to Medical Summary. This tool builds a professional one-page clinical summary from all your MedAdvocate data — ready to hand to any new doctor in 60 seconds.'
    },
    {
      target: '#sources_grid',
      title: 'Choose What to Include',
      body: 'Green dots mean you already have data in that section. Click any chip to toggle it on or off. Everything green is selected by default.',
      voice: 'These chips show which sections have data. Green means data is available. Click any chip to toggle it on or off. Everything green is selected by default.'
    },
    {
      target: '#sum_purpose',
      title: 'Set the Appointment Context',
      body: 'Enter the appointment this summary is for — the doctor\'s name and practice. This prints at the top of the document so the specialist knows exactly why you\'re there.',
      voice: 'Enter the appointment this summary is for — the doctor\'s name and practice. This prints at the top of the document.'
    },
    {
      target: '.two-col',
      title: 'Add Context and Goals',
      body: 'Optionally add anything else the doctor should know, and describe what you\'re hoping to get from the visit — a diagnosis, referral, or new treatment.',
      voice: 'Optionally add any extra context the doctor should know, and describe your goals for the visit.'
    },
    {
      target: '#gen_btn',
      title: 'Generate Your Summary',
      body: 'When ready, click here. Claude will produce a full clinical summary document you can print, copy, or email directly to the doctor\'s office.',
      voice: 'When you\'re ready, click this button. Claude will produce a full clinical summary you can print, copy, or email to the doctor\'s office. You\'re all set.'
    }
  ];

  let current = -1;

  function getVoice() {
    const voices = speechSynthesis.getVoices();
    const prefs = ['Samantha', 'Karen', 'Moira', 'Fiona', 'Microsoft Aria', 'Google US English', 'Microsoft Zira'];
    for (const name of prefs) {
      const v = voices.find(v => v.name.includes(name) && v.lang.startsWith('en'));
      if (v) return v;
    }
    return voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en')) || null;
  }

  function speak(text) {
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    const voice = getVoice();
    if (voice) utt.voice = voice;
    utt.rate = 0.95; utt.pitch = 1.0; utt.volume = 1.0;
    speechSynthesis.speak(utt);
  }

  function clearRing() {
    document.querySelectorAll('.tour-ring').forEach(el => el.classList.remove('tour-ring'));
  }

  function positionCard(targetEl) {
    const card = document.getElementById('tourCard');
    if (!card || !targetEl) return;
    const rect = targetEl.getBoundingClientRect();
    const cw = 340, ch = card.offsetHeight || 170, margin = 14;
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = Math.max(margin, Math.min(vw - cw - margin, rect.left + (rect.width - cw) / 2));
    let top = (vh - rect.bottom >= ch + margin * 2) ? rect.bottom + margin
            : (rect.top >= ch + margin * 2) ? rect.top - ch - margin
            : Math.max(margin, (vh - ch) / 2);
    card.style.left = left + 'px';
    card.style.top = top + 'px';
  }

  function showStep(idx) {
    const step = STEPS[idx];
    if (!step) return;
    current = idx;
    clearRing();
    const targetEl = document.querySelector(step.target);
    if (targetEl) {
      targetEl.classList.add('tour-ring');
      targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    const card = document.getElementById('tourCard');
    card.querySelector('.tour-step-num').textContent = `Step ${idx + 1} of ${STEPS.length}`;
    card.querySelector('.tour-card-title').textContent = step.title;
    card.querySelector('.tour-card-body').textContent = step.body;
    card.querySelector('.tour-next-btn').textContent = idx === STEPS.length - 1 ? 'Done ✓' : 'Next →';
    card.classList.remove('hidden');
    card.style.opacity = '0';
    setTimeout(() => { if (targetEl) positionCard(targetEl); card.style.opacity = '1'; }, 450);
    if (speechSynthesis.getVoices().length === 0) {
      speechSynthesis.onvoiceschanged = () => speak(step.voice);
    } else {
      speak(step.voice);
    }
  }

  window.tourNext = function () {
    current >= STEPS.length - 1 ? endTour() : showStep(current + 1);
  };
  window.tourSkip = function () { endTour(); };

  function endTour() {
    clearRing();
    speechSynthesis.cancel();
    const card = document.getElementById('tourCard');
    if (card) card.classList.add('hidden');
  }

  window.tourStart = function () {
    speechSynthesis.cancel();
    localStorage.setItem(TOUR_KEY, '1');
    current = -1;
    showStep(0);
  };

  if (!localStorage.getItem(TOUR_KEY)) setTimeout(window.tourStart, 900);
})();
</script>
